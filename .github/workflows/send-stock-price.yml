name: Send VN stock price email

on:
  schedule:
    # User-set schedule: every 30 minutes. Do not change this line.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest
    env:
      # Without the Gmail secrets, the Send step is skipped (with a warning)
      # instead of failing the run every time.
      HAS_GMAIL: ${{ secrets.GMAIL_ADDRESS != '' && secrets.GMAIL_APP_PASSWORD != '' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate email body
        env:
          WATCHLIST: ${{ vars.WATCHLIST }}
          TOP_N_STOCKS: ${{ vars.TOP_N_STOCKS }}
          ALERT_THRESHOLD_PERCENT: ${{ vars.ALERT_THRESHOLD_PERCENT }}
          DEBUG_EMPTY_RESPONSES: ${{ vars.DEBUG_EMPTY_RESPONSES }}
        run: python vn_stock_price_emailer.py generate

      - name: Warn that the Gmail secrets are missing
        if: env.HAS_GMAIL != 'true'
        run: echo "::warning::GMAIL_ADDRESS / GMAIL_APP_PASSWORD secrets are not set, so no email was sent. Add them in Settings -> Secrets and variables -> Actions."

      - name: Send email
        if: env.HAS_GMAIL == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          STOCK_RECIPIENT: ${{ secrets.STOCK_RECIPIENT }}
        run: python vn_stock_price_emailer.py send

      - name: Commit updated state/history files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in last_prices.json price_history.csv msn_id_cache.json watchlist_cache.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Update price state [skip ci]"
          git push
